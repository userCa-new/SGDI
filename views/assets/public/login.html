<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Entrar — SGDI</title>
        <link rel="stylesheet" href="styles/auth.css" />
        <link rel="stylesheet" href="../_common/styles/design-system.css" />
        <link rel="stylesheet" href="styles/redesign.css" />
        <script type="module" src="scripts/login.js"></script>
    </head>
    <body class="public-shell">
        <header class="navbar-simple">
            <nav aria-label="Início">
                <a href="index.html" class="logo">SGDI</a>
                <a href="index.html" class="nav-link">Voltar ao início</a>
            </nav>
        </header>

        <main class="auth-page">
            <section class="auth-card" aria-labelledby="login-title">
                <header class="auth-header">
                    <p class="eyebrow">Bem-vindo de volta</p>
                    <h1 id="login-title">Acesse sua conta</h1>
                    <p>Entre para continuar na área do seu perfil.</p>
                </header>

                <form id="login-form" class="auth-form" action="#" method="post">
                    <label for="email">E-mail
                        <input id="email" type="email" name="email" autocomplete="username" placeholder="voce@exemplo.com" required />
                    </label>

                    <label for="senha">Senha
                        <input id="senha" type="password" name="senha" autocomplete="current-password" placeholder="Sua senha" required />
                    </label>

                    <button type="submit">Entrar</button>
                </form>

                <p class="auth-note">Ainda não tem conta? <a href="cadastro.html">Criar cadastro</a></p>
            </section>

            <aside class="auth-aside">
                <h2>Uma locação mais organizada começa por aqui.</h2>
                <p>Encontre as informações do imóvel, os pagamentos e as conversas no espaço do seu perfil.</p>
            </aside>
        </main>
    </body>
</html>
