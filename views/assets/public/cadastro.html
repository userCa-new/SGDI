<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Criar conta — SGDI</title>
        <link rel="stylesheet" href="styles/auth.css" />
        <link rel="stylesheet" href="../_common/styles/design-system.css" />
        <link rel="stylesheet" href="styles/redesign.css" />
        <script type="module" src="scripts/cadastro.js"></script>
    </head>
    <body class="public-shell">
        <header class="navbar-simple">
            <nav aria-label="Início">
                <a href="index.html" class="logo">SGDI</a>
                <a href="index.html" class="nav-link">Voltar ao início</a>
            </nav>
        </header>

        <main class="auth-page">
            <section class="auth-card" aria-labelledby="signup-title">
                <header class="auth-header">
                    <p class="eyebrow">Comece pelo essencial</p>
                    <h1 id="signup-title">Crie sua conta</h1>
                    <p>Informe seus dados e selecione o perfil que representa sua rotina.</p>
                </header>

                <form id="signup-form" class="auth-form" action="#" method="post">
                    <label for="nome">Nome completo
                        <input id="nome" type="text" name="name" autocomplete="name" placeholder="Seu nome" required />
                    </label>

                    <label for="email-signup">E-mail
                        <input id="email-signup" type="email" name="email" autocomplete="email" placeholder="voce@exemplo.com" required />
                    </label>

                    <label for="tipo">Perfil
                        <select id="tipo" name="type_user" required>
                            <option value="">Selecione seu perfil</option>
                            <option value="proprietario">Proprietário</option>
                            <option value="inquilino">Inquilino</option>
                        </select>
                    </label>

                    <label for="senha-signup">Senha
                        <input id="senha-signup" type="password" name="password" autocomplete="new-password" minlength="6" placeholder="Pelo menos 6 caracteres" required />
                    </label>

                    <button type="submit">Criar conta</button>
                </form>

                <p class="auth-note">Já tem conta? <a href="login.html">Entrar</a></p>
            </section>

            <aside class="auth-aside">
                <h2>Uma experiência feita para os dois lados da locação.</h2>
                <p>Escolha seu perfil para acessar informações e tarefas que fazem sentido para você.</p>
            </aside>
        </main>
    </body>
</html>
